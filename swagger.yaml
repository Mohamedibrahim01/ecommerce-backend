openapi: 3.0.0
info:
  title: E-Commerce Supplements API
  version: 1.0.0
  description: Complete REST API Documentation for E-Commerce Supplements Store
servers:
  - url: http://localhost:5000/api/v1
    description: Local Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  # ================= AUTHENTICATION =================
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, confirmPassword]
              properties:
                name:
                  type: string
                  example: "Mohamed Ibrahim"
                email:
                  type: string
                  example: "mohamed@example.com"
                password:
                  type: string
                  example: "Password@123"
                confirmPassword:
                  type: string
                  example: "Password@123"
      responses:
        201:
          description: User registered successfully
        400:
          description: Validation error or user already exists

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login user & set refresh token in cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: "admin@example.com"
                password:
                  type: string
                  example: "Password@123"
      responses:
        200:
          description: User authenticated successfully
        401:
          description: Invalid email or password

  /auth/refresh-token:
    post:
      tags: [Authentication]
      summary: Refresh Access Token using Refresh Token Cookie
      responses:
        200:
          description: New Access Token generated
        401:
          description: Refresh token missing or expired

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout user & clear refresh token cookie
      responses:
        200:
          description: Logged out successfully

  /auth/confirm-email/{token}:
    get:
      tags: [Authentication]
      summary: Confirm user email address via token
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
          description: Unhashed token received in confirmation email
      responses:
        200:
          description: Email confirmed successfully
        400:
          description: Invalid or expired confirmation token

  /auth/resend-confirmation:
    post:
      tags: [Authentication]
      summary: Resend email confirmation link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  example: "mohamed@example.com"
      responses:
        200:
          description: Confirmation email sent successfully
        400:
          description: Email is already confirmed
        404:
          description: User not found

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request password reset link via email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  example: "mohamed@example.com"
      responses:
        200:
          description: Reset token sent to email
        404:
          description: No user found with this email

  /auth/reset-password/{token}:
    post:
      tags: [Authentication]
      summary: Reset password using received token
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
          description: Reset token received in password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirmPassword]
              properties:
                password:
                  type: string
                  example: "NewPassword@123"
                confirmPassword:
                  type: string
                  example: "NewPassword@123"
      responses:
        200:
          description: Password reset successful
        400:
          description: Token is invalid or has expired / Passwords do not match

  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Change password for logged-in user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, confirmNewPassword]
              properties:
                currentPassword:
                  type: string
                  example: "Password@123"
                newPassword:
                  type: string
                  example: "NewPassword@123"
                confirmNewPassword:
                  type: string
                  example: "NewPassword@123"
      responses:
        200:
          description: Password changed successfully
        401:
          description: Current password is incorrect or unauthorized
  # ================= USER PROFILE =================
  /users/profile:
    get:
      tags: [User Profile]
      summary: Get logged-in user profile
      security:
        - BearerAuth: []
      responses:
        200:
          description: User profile data
        401:
          description: Not authorized
    put:
      tags: [User Profile]
      summary: Update user profile details
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Mohamed Ibrahim"
                email:
                  type: string
                  example: "mohamed@example.com"
                password:
                  type: string
                  example: "NewPassword@123"
      responses:
        200:
          description: Profile updated successfully
        401:
          description: Not authorized

  /users/profile/avatar:
    put:
      tags: [User Profile]
      summary: Upload user profile avatar
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        200:
          description: Avatar uploaded successfully
        400:
          description: Invalid file type or upload error

  # ================= USERS MANAGEMENT (ADMIN) =================
  /users/all-users:
    get:
      tags: [Admin - Users]
      summary: Get list of all registered users
      security:
        - BearerAuth: []
      responses:
        200:
          description: List of all users
        403:
          description: Admin access required

  /users/{id}:
    get:
      tags: [Admin - Users]
      summary: Get user details by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: User data
        404:
          description: User not found
    put:
      tags: [Admin - Users]
      summary: Update user data or admin role
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Updated Name"
                email:
                  type: string
                  example: "updated@example.com"
                isAdmin:
                  type: boolean
                  example: true
      responses:
        200:
          description: User updated successfully
        404:
          description: User not found
    delete:
      tags: [Admin - Users]
      summary: Delete a user by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: User deleted successfully
        404:
          description: User not found

  # ================= CATEGORIES =================
  /categories:
    get:
      tags: [Categories]
      summary: Get all categories
      responses:
        200:
          description: List of categories
    post:
      tags: [Categories]
      summary: Create a new category (Admin)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "Proteins"
                description:
                  type: string
                  example: "Whey and Isolate Protein Supplements"
                image:
                  type: string
                  example: "/uploads/category-protein.png"
                isActive:
                  type: boolean
                  example: true
      responses:
        201:
          description: Category created successfully
        400:
          description: Category name already exists or invalid data

  /categories/{slug}:
    get:
      tags: [Categories]
      summary: Get single category by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          example: "proteins"
      responses:
        200:
          description: Category details
        404:
          description: Category not found

  /categories/{id}:
    put:
      tags: [Categories]
      summary: Update category by ID (Admin)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Updated Category Name"
                description:
                  type: string
                  example: "Updated description text"
                image:
                  type: string
                  example: "/uploads/cat-updated.png"
                isActive:
                  type: boolean
                  example: true
      responses:
        200:
          description: Category updated successfully
        404:
          description: Category not found
    delete:
      tags: [Categories]
      summary: Delete category by ID (Admin)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Category deleted successfully
        404:
          description: Category not found

  # ================= PRODUCTS =================
  /products:
    get:
      tags: [Products]
      summary: Get paginated products with keyword and category filter
      parameters:
        - in: query
          name: keyword
          schema:
            type: string
          description: Product name search keyword
        - in: query
          name: category
          schema:
            type: string
          description: Filter by Category ID
        - in: query
          name: pageNumber
          schema:
            type: integer
            default: 1
          description: Page number for pagination
      responses:
        200:
          description: Paginated product list
    post:
      tags: [Products]
      summary: Create new product (Admin)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [name, price, description, image, brand, category, countInStock]
              properties:
                name:
                  type: string
                  example: "Gold Standard 100% Whey"
                price:
                  type: number
                  example: 89.99
                description:
                  type: string
                  example: "24g of pure whey protein isolate"
                image:
                  type: string
                  example: "/uploads/whey-gold.png"
                brand:
                  type: string
                  example: "Optimum Nutrition"
                category:
                  type: string
                  example: "664b1f8e2c4d5a0012a3b4c5"
                countInStock:
                  type: integer
                  example: 25
      responses:
        201:
          description: Product created successfully
        400:
          description: Validation error

  /products/{id}:
    get:
      tags: [Products]
      summary: Get product details by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Product details with populated category
        404:
          description: Product not found
    put:
      tags: [Products]
      summary: Update product details by ID (Admin)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                price:
                  type: number
                description:
                  type: string
                image:
                  type: string
                brand:
                  type: string
                category:
                  type: string
                countInStock:
                  type: integer
      responses:
        200:
          description: Product updated successfully
        404:
          description: Product not found
    delete:
      tags: [Products]
      summary: Delete product by ID (Admin)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Product deleted successfully
        404:
          description: Product not found

  /products/{id}/reviews:
    post:
      tags: [Products]
      summary: Create a product review
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, comment]
              properties:
                rating:
                  type: number
                  minimum: 1
                  maximum: 5
                  example: 5
                comment:
                  type: string
                  example: "Excellent taste and quality!"
      responses:
        201:
          description: Review added successfully
        400:
          description: Product already reviewed or invalid rating

  # ================= ORDERS =================
  /orders:
    post:
      tags: [Orders]
      summary: Create a new order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderItems
                - shippingAddress
                - paymentMethod
                - itemsPrice
                - taxPrice
                - shippingPrice
                - totalPrice
              properties:
                orderItems:
                  type: array
                  items:
                    type: object
                    required: [name, qty, image, price, product]
                    properties:
                      name: { type: string, example: "ISO 100 Hydrolyzed" }
                      qty: { type: integer, example: 1 }
                      image: { type: string, example: "/uploads/iso-100.png" }
                      price: { type: number, example: 94.5 }
                      product:
                        { type: string, example: "664b1f8e2c4d5a0012a3b4c5" }
                shippingAddress:
                  type: object
                  required: [address, city, postalCode, country]
                  properties:
                    address: { type: string, example: "Hadayek October" }
                    city: { type: string, example: "Giza" }
                    postalCode: { type: string, example: "12566" }
                    country: { type: string, example: "Egypt" }
                paymentMethod:
                  type: string
                  example: "Card"
                itemsPrice:
                  type: number
                  example: 94.5
                taxPrice:
                  type: number
                  example: 13.23
                shippingPrice:
                  type: number
                  example: 10.0
                totalPrice:
                  type: number
                  example: 117.73
      responses:
        201:
          description: Order created successfully
        400:
          description: No order items found
    get:
      tags: [Orders]
      summary: Get all orders across the store (Admin)
      security:
        - BearerAuth: []
      responses:
        200:
          description: List of all orders
        403:
          description: Admin access required

  /orders/my-orders:
    get:
      tags: [Orders]
      summary: Get logged-in user order history
      security:
        - BearerAuth: []
      responses:
        200:
          description: List of logged-in user orders
        401:
          description: Not authorized

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order details by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Order details
        404:
          description: Order not found

  /orders/{id}/pay:
    put:
      tags: [Orders]
      summary: Update order status to paid
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string, example: "PAY_TRANSACTION_ID" }
                status: { type: string, example: "COMPLETED" }
                update_time: { type: string, example: "2026-08-29T20:00:00Z" }
                email_address: { type: string, example: "payer@example.com" }
      responses:
        200:
          description: Order updated to paid
        404:
          description: Order not found

  /orders/{id}/deliver:
    put:
      tags: [Orders]
      summary: Update order status to delivered (Admin)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Order updated to delivered
        404:
          description: Order not found
