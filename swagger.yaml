openapi: 3.0.0
info:
  title: E-Commerce Supplements API
  version: 1.0.0
  description: Complete REST API Documentation for E-Commerce Supplements Store
servers:
  - url: http://localhost:5000/api/v1
    description: Local Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  # ================= AUTHENTICATION =================
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, confirmPassword]
              properties:
                name:
                  type: string
                  example: "Mohamed Ibrahim"
                email:
                  type: string
                  example: "mohamed@example.com"
                password:
                  type: string
                  example: "Password@123"
                confirmPassword:
                  type: string
                  example: "Password@123"
      responses:
        201:
          description: User registered successfully
        400:
          description: Validation error or user already exists

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login user & set refresh token in cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: "admin@example.com"
                password:
                  type: string
                  example: "Password@123"
      responses:
        200:
          description: User authenticated successfully
        401:
          description: Invalid email or password
  /auth/refresh-token:
    post:
      tags: [Authentication]
      summary: Refresh Access Token using Refresh Token Cookie
      responses:
        200:
          description: New Access Token generated
        401:
          description: Refresh token missing or expired

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout user & clear refresh token cookie
      responses:
        200:
          description: Logged out successfully

  /auth/confirm-email/{token}:
    get:
      tags: [Authentication]
      summary: Confirm user email address via token
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
          description: Unhashed token received in confirmation email
      responses:
        200:
          description: Email confirmed successfully
        400:
          description: Invalid or expired confirmation token

  /auth/resend-confirmation:
    post:
      tags: [Authentication]
      summary: Resend email confirmation link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  example: "mohamed@example.com"
      responses:
        200:
          description: Confirmation email sent successfully
        400:
          description: Email is already confirmed
        404:
          description: User not found

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request password reset link via email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  example: "mohamed@example.com"
      responses:
        200:
          description: Reset token sent to email
        404:
          description: No user found with this email

  /auth/reset-password/{token}:
    post:
      tags: [Authentication]
      summary: Reset password using received token
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
          description: Reset token received in password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirmPassword]
              properties:
                password:
                  type: string
                  example: "NewPassword@123"
                confirmPassword:
                  type: string
                  example: "NewPassword@123"
      responses:
        200:
          description: Password reset successful
        400:
          description: Token is invalid or has expired / Passwords do not match

  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Change password for logged-in user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, confirmNewPassword]
              properties:
                currentPassword:
                  type: string
                  example: "Password@123"
                newPassword:
                  type: string
                  example: "NewPassword@123"
                confirmNewPassword:
                  type: string
                  example: "NewPassword@123"
      responses:
        200:
          description: Password changed successfully
        401:
          description: Current password is incorrect or unauthorized
  # ================= USER PROFILE =================
  /users/profile:
    get:
      tags: [User Profile]
      summary: Get logged-in user profile
      security:
        - BearerAuth: []
      responses:
        200:
          description: User profile data
        401:
          description: Not authorized
    put:
      tags: [User Profile]
      summary: Update user profile details
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Mohamed Ibrahim"
                email:
                  type: string
                  example: "mohamed@example.com"
                password:
                  type: string
                  example: "NewPassword@123"
      responses:
        200:
          description: Profile updated successfully
        401:
          description: Not authorized

  /users/profile/avatar:
    put:
      tags: [User Profile]
      summary: Upload user profile avatar
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        200:
          description: Avatar uploaded successfully
        400:
          description: Invalid file type or upload error

  # ================= USERS MANAGEMENT (ADMIN) =================
  /users/all-users:
    get:
      tags: [Admin - Users]
      summary: Get list of all registered users
      security:
        - BearerAuth: []
      responses:
        200:
          description: List of all users
        403:
          description: Admin access required

  /users/{id}:
    get:
      tags: [Admin - Users]
      summary: Get user details by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: User data
        404:
          description: User not found
    put:
      tags: [Admin - Users]
      summary: Update user data or admin role
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Updated Name"
                email:
                  type: string
                  example: "updated@example.com"
                isAdmin:
                  type: boolean
                  example: true
      responses:
        200:
          description: User updated successfully
        404:
          description: User not found
    delete:
      tags: [Admin - Users]
      summary: Delete a user by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: User deleted successfully
        404:
          description: User not found

  # ================= CATEGORIES =================
  /categories:
    get:
      tags: [Categories]
      summary: Get all categories
      responses:
        200:
          description: List of categories retrieved successfully

    post:
      tags: [Categories]
      summary: Create a new category (Admin)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "Whey Protein"
                description:
                  type: string
                  example: "Pure whey protein isolate and blends"
                image:
                  type: string
                  example: "/uploads/category-whey.png"
      responses:
        201:
          description: Category created successfully
        400:
          description: Category already exists or invalid data
        401:
          description: Not authorized
        403:
          description: Admin access required

  /categories/{slug}:
    get:
      tags: [Categories]
      summary: Get single category by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          description: Category slug identifier (e.g. whey-protein)
      responses:
        200:
          description: Category details retrieved successfully
        404:
          description: Category not found

  /categories/{id}:
    put:
      tags: [Categories]
      summary: Update category by ID (Admin)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Category MongoDB ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Whey Protein Isolate"
                description:
                  type: string
                  example: "Updated description for whey isolate"
                image:
                  type: string
                  example: "/uploads/category-updated.png"
      responses:
        200:
          description: Category updated successfully
        404:
          description: Category not found
        401:
          description: Not authorized
        403:
          description: Admin access required

    delete:
      tags: [Categories]
      summary: Delete category by ID (Admin)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Category MongoDB ID
      responses:
        200:
          description: Category deleted successfully
        404:
          description: Category not found
        401:
          description: Not authorized
        403:
          description: Admin access required
  # ================= PRODUCTS =================
  /products:
    get:
      tags: [Products]
      summary: Get paginated products with keyword and category filter
      parameters:
        - in: query
          name: pageNumber
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: keyword
          schema:
            type: string
          description: Search term to filter products by name
        - in: query
          name: category
          schema:
            type: string
          description: Category ID to filter products
      responses:
        200:
          description: Products retrieved successfully

    post:
      tags: [Products]
      summary: Create new product (Admin)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price, description, category, countInStock]
              properties:
                name:
                  type: string
                  example: "Gold Standard 100% Whey"
                price:
                  type: number
                  example: 75.99
                description:
                  type: string
                  example: "Premium whey protein blend"
                image:
                  type: string
                  example: "/uploads/product-whey.png"
                category:
                  type: string
                  example: "664b1f8e2c4d5a0012a3b4c1"
                countInStock:
                  type: integer
                  example: 25
      responses:
        201:
          description: Product created successfully
        400:
          description: Invalid product data
        401:
          description: Not authorized
        403:
          description: Admin access required

  /products/top:
    get:
      tags: [Products]
      summary: Get top rated products
      responses:
        200:
          description: Top rated products list

  /products/{id}:
    get:
      tags: [Products]
      summary: Get product details by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Product MongoDB ID
      responses:
        200:
          description: Product details retrieved successfully
        404:
          description: Product not found

    put:
      tags: [Products]
      summary: Update product details by ID (Admin)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Product MongoDB ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Gold Standard 100% Whey 5Lbs"
                price:
                  type: number
                  example: 79.99
                description:
                  type: string
                image:
                  type: string
                category:
                  type: string
                countInStock:
                  type: integer
                  example: 30
      responses:
        200:
          description: Product updated successfully
        404:
          description: Product not found
        401:
          description: Not authorized
        403:
          description: Admin access required

    delete:
      tags: [Products]
      summary: Delete product by ID (Admin)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Product MongoDB ID
      responses:
        200:
          description: Product deleted successfully
        404:
          description: Product not found
        401:
          description: Not authorized
        403:
          description: Admin access required

  /products/{id}/reviews:
    post:
      tags: [Products]
      summary: Create a product review
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Product MongoDB ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, comment]
              properties:
                rating:
                  type: number
                  minimum: 1
                  maximum: 5
                  example: 5
                comment:
                  type: string
                  example: "High quality and fast shipping!"
      responses:
        201:
          description: Review added successfully
        400:
          description: Product already reviewed by this user
        401:
          description: Not authorized
        404:
          description: Product not found
  # ================= ORDERS =================
  # ================= ORDERS =================
  /orders:
    post:
      tags: [Orders]
      summary: Create a new order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  orderItems,
                  shippingAddress,
                  paymentMethod,
                  itemsPrice,
                  totalPrice,
                ]
              properties:
                orderItems:
                  type: array
                  items:
                    type: object
                    required: [name, qty, price, product]
                    properties:
                      name:
                        type: string
                        example: "Gold Standard Whey"
                      qty:
                        type: integer
                        example: 2
                      image:
                        type: string
                      price:
                        type: number
                        example: 75.99
                      product:
                        type: string
                        example: "664b1f8e2c4d5a0012a3b4c5"
                shippingAddress:
                  type: object
                  required: [address, city, postalCode, country]
                  properties:
                    address:
                      type: string
                      example: "123 Main St"
                    city:
                      type: string
                      example: "Cairo"
                    postalCode:
                      type: string
                      example: "11511"
                    country:
                      type: string
                      example: "Egypt"
                paymentMethod:
                  type: string
                  example: "Cash on Delivery"
                itemsPrice:
                  type: number
                  example: 151.98
                shippingPrice:
                  type: number
                  example: 10.00
                taxPrice:
                  type: number
                  example: 0.00
                totalPrice:
                  type: number
                  example: 161.98
      responses:
        201:
          description: Order created successfully
        400:
          description: No order items or out of stock
        401:
          description: Not authorized

    get:
      tags: [Orders]
      summary: Get all orders across the store (Admin)
      security:
        - BearerAuth: []
      responses:
        200:
          description: All orders retrieved successfully
        401:
          description: Not authorized
        403:
          description: Admin access required

  /orders/my-orders:
    get:
      tags: [Orders]
      summary: Get logged-in user order history
      security:
        - BearerAuth: []
      responses:
        200:
          description: User orders retrieved successfully
        401:
          description: Not authorized

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order details by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Order MongoDB ID
      responses:
        200:
          description: Order details retrieved successfully
        403:
          description: Forbidden to view another user's order
        404:
          description: Order not found

  /orders/{id}/cancel:
    put:
      tags: [Orders]
      summary: Cancel order and restore stock
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Order MongoDB ID
      responses:
        200:
          description: Order cancelled successfully
        400:
          description: Cannot cancel already delivered order
        404:
          description: Order not found

  /orders/{id}/pay:
    put:
      tags: [Orders]
      summary: Update order status to paid
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Order MongoDB ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                status:
                  type: string
                update_time:
                  type: string
                payer:
                  type: object
                  properties:
                    email_address:
                      type: string
      responses:
        200:
          description: Order marked as paid
        404:
          description: Order not found

  /orders/{id}/deliver:
    put:
      tags: [Orders]
      summary: Update order status to delivered (Admin)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Order MongoDB ID
      responses:
        200:
          description: Order marked as delivered
        404:
          description: Order not found
        403:
          description: Admin access required
  # ================= CART =================
  /carts:
    get:
      tags: [Cart]
      summary: Get logged-in user cart
      security:
        - BearerAuth: []
      responses:
        200:
          description: Cart retrieved successfully
        401:
          description: Not authorized

  /carts/add:
    post:
      tags: [Cart]
      summary: Add an item to the cart
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId:
                  type: string
                  example: "664b1f8e2c4d5a0012a3b4c5"
                quantity:
                  type: integer
                  default: 1
                  example: 2
      responses:
        200:
          description: Item added to cart successfully
        400:
          description: Quantity exceeds available stock
        404:
          description: Product not found

  /carts/update-quantity:
    put:
      tags: [Cart]
      summary: Update product quantity in cart
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId:
                  type: string
                  example: "664b1f8e2c4d5a0012a3b4c5"
                quantity:
                  type: integer
                  minimum: 1
                  example: 3
      responses:
        200:
          description: Cart quantity updated successfully
        400:
          description: Quantity exceeds available stock or less than 1
        404:
          description: Cart or product not found

  /carts/remove/{productId}:
    delete:
      tags: [Cart]
      summary: Remove a product from cart
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: ID of the product to remove
      responses:
        200:
          description: Item removed from cart
        404:
          description: Cart not found

  /carts/clear:
    delete:
      tags: [Cart]
      summary: Clear entire cart
      security:
        - BearerAuth: []
      responses:
        200:
          description: Cart cleared successfully
        401:
          description: Not authorized
# ================= ADDRESSES =================
  /users/addresses:
    get:
      tags: [User Profile]
      summary: Get user saved addresses
      security:
        - BearerAuth: []
      responses:
        200:
          description: Addresses list retrieved successfully

    post:
      tags: [User Profile]
      summary: Add new address
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [street, city, postalCode, country, phone]
              properties:
                alias:
                  type: string
                  example: "Home"
                street:
                  type: string
                  example: "15 El-Tahrir St"
                city:
                  type: string
                  example: "Cairo"
                postalCode:
                  type: string
                  example: "11511"
                country:
                  type: string
                  example: "Egypt"
                phone:
                  type: string
                  example: "01012345678"
                isDefault:
                  type: boolean
                  example: true
      responses:
        201:
          description: Address added successfully

  /users/addresses/{addressId}:
    delete:
      tags: [User Profile]
      summary: Delete address by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: addressId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Address deleted successfully